name: build-autodosingagro

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: "Install SDK packages (compileSdk 35)"
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'app/build.gradle') }}

      - name: Pulihkan keystore tetap dari secret
        env:
          AUTODOSING_KEYSTORE_BASE64: ${{ secrets.AUTODOSING_KEYSTORE_BASE64 }}
          AUTODOSING_KEYSTORE_PASSWORD: ${{ secrets.AUTODOSING_KEYSTORE_PASSWORD }}
          AUTODOSING_KEY_ALIAS: ${{ secrets.AUTODOSING_KEY_ALIAS }}
          AUTODOSING_KEY_PASSWORD: ${{ secrets.AUTODOSING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${AUTODOSING_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret AUTODOSING_KEYSTORE_BASE64 belum diisi — build dibatalkan agar tidak bertanda tangan acak."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$AUTODOSING_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/autodosing.keystore"
          test -s "$HOME/.android/autodosing.keystore"
          {
            echo "AUTODOSING_STORE_FILE=$HOME/.android/autodosing.keystore"
            echo "AUTODOSING_STORE_PASSWORD=$AUTODOSING_KEYSTORE_PASSWORD"
            echo "AUTODOSING_KEY_ALIAS=$AUTODOSING_KEY_ALIAS"
            echo "AUTODOSING_KEY_PASSWORD=$AUTODOSING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Keystore tetap dipulihkan ($(stat -c%s "$HOME/.android/autodosing.keystore") byte)."

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verifikasi APK (paket, versi, sidik jari penanda tangan)
        env:
          EXPECTED_SHA256: "0CF4123CC63D179770F2006EA482666EC0220A9039797C655707F575E63BC637"
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          test -n "$APK"
          echo "APK: $APK"
          ls -lh "$APK"
          sha256sum "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -3
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump permissions "$APK" || true
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          echo "--- apksigner verify ---"
          "$APKSIGNER" verify --print-certs "$APK"
          FP=$("$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256 digest" | head -1 | awk '{print $NF}' | tr -d ':' | tr 'a-f' 'A-F')
          echo "Fingerprint SHA-256: $FP"
          test -n "$FP"
          if [ "$FP" != "$EXPECTED_SHA256" ]; then
            echo "::error::Fingerprint ($FP) tidak cocok dengan keystore yang di-pin ($EXPECTED_SHA256)."
            exit 1
          fi
          echo "Fingerprint COCOK dengan keystore yang di-pin."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: autodosingagro-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
