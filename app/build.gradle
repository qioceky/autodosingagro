plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
    alias(libs.plugins.jetbrains.kotlin.compose)
}

android {
    namespace 'id.autodosingagro'
    compileSdk 35

    defaultConfig {
        applicationId "id.autodosingagro"
        minSdk 26
        targetSdk 35
        versionCode 16
        versionName "1.14.0"
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    signingConfigs {
        pinned {
            storeFile file(System.getenv("AUTODOSING_STORE_FILE") ?: "/nonexistent/autodosing-pinned.keystore")
            storePassword System.getenv("AUTODOSING_STORE_PASSWORD") ?: "android"
            keyAlias System.getenv("AUTODOSING_KEY_ALIAS") ?: "autodosing"
            keyPassword System.getenv("AUTODOSING_KEY_PASSWORD") ?: "android"
            storeType "jks"
        }
    }

    buildTypes {
        release {
            if (System.getenv("AUTODOSING_STORE_FILE")) {
                signingConfig signingConfigs.pinned
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            if (System.getenv("AUTODOSING_STORE_FILE")) {
                signingConfig signingConfigs.pinned
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation libs.core.ktx
    implementation libs.activity.compose
    implementation libs.lifecycle.viewmodel.compose
    implementation libs.lifecycle.runtime.compose
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material3
}
